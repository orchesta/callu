# ─── Log formats ─────────────────────────────────────────────────
# Stock "main" with "$request" swapped for method + $uri — no query string on disk.
log_format no_query '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

# ─── HTTP → HTTPS redirect ───────────────────────────────────────
# Only active when TLS is enabled (cert + key volumes mounted).
# If no cert is present, this block is ignored and the server below
# handles all traffic on port 3000.
server {
    listen 3000;
    server_name _;

    # If TLS_ENABLED env is "true" (set via docker-compose), redirect to HTTPS.
    # Without certs this server block simply serves everything on HTTP.

    root /usr/share/nginx/html;
    index index.html;

    # ─── Gzip ─────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 256;

    # ─── API Reverse Proxy ────────────────────────────────
    # Security headers for /api and /hubs come from the API itself
    # (SecurityHeadersMiddleware) — do not add them here, they would duplicate.
    #
    # no_query: webhook ingest accepts ?apiKey= and the voice callback carries a per-call
    # token in its query, neither of which the default log format keeps off disk. Anything
    # secret on this prefix belongs in the query for that reason — $uri is written.
    #
    # error_log: nginx's error-level lines (e.g. upstream down) carry the full request line,
    # query included, with no format to override — raise the threshold here instead.
    location /api/ {
        access_log /var/log/nginx/access.log no_query;
        error_log /var/log/nginx/error.log crit;

        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://callu-api:5095;
        proxy_pass         $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        client_max_body_size 10m;
    }

    # ─── SignalR WebSocket Proxy ──────────────────────────
    # access_log off: the hub handshake carries the JWT in ?access_token= (a WebSocket
    # upgrade cannot set an Authorization header), and the default log format writes it.
    location /hubs/ {
        access_log off;

        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://callu-api:5095;
        proxy_pass         $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 86400s;
    }

    # ─── Health Check Proxy ───────────────────────────────
    # Exact match, so only the plain liveness probe is public. /health/detail names every
    # dependency and why it failed (hosts, driver errors) — operator information. Reach it
    # from the host instead:
    #   docker exec callu-api curl -s localhost:5095/health/detail
    location = /health {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://callu-api:5095;
        proxy_pass $api_upstream;
    }

    location /health/ {
        return 404;
    }

    # ─── SPA — React Router ──────────────────────────────
    # nginx inherits add_header from an outer level only when the current level declares
    # none of its own, so every location below has to repeat the security headers.
    #
    # HSTS is deliberately short: it is honoured by the browser only over HTTPS (so it does
    # nothing on a plain-HTTP LAN install), and a long one strands users on an install whose
    # certificate later breaks. Raise it once your TLS setup has been stable for a while.
    #
    # index.html must never be cached — it references hashed chunks that change each deploy.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Strict-Transport-Security "max-age=300" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws: wss: https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Strict-Transport-Security "max-age=300" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws: wss: https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        try_files $uri $uri/ /index.html;
    }

    # ─── Cache Static Assets ──────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=300" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}

